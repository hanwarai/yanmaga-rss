name: github pages publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。読み取りは ci.yaml と
      # 共有するためスクリプトに切り出してある。
      - name: Resolve uv version
        id: uv-version
        run: .github/scripts/resolve-uv-version.sh >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      # --locked: uv.lock が pyproject.toml と整合していなければ失敗させる。
      # これがないと lock が壊れた PR でも暗黙に再解決されて green になってしまう。
      - name: Install the project
        run: uv sync --locked --all-extras

      - name: main.py
        run: uv run main.py

      - name: Deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: feeds

  publish:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
